<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EBDD">
<meta name="description" content="心晴 MoodNest：说不清也能记录。每一次记录都会在像素小院里种下一株植物，再陪你做一件适合当下的小事。">
<title>心晴 MoodNest · 情绪小院</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">心晴 <small>MoodNest</small></div>
    <div class="top-btns">
      <button class="icon-btn" id="btn-sound" aria-label="打开小院声音">🔈</button>
      <button class="icon-btn" id="btn-settings" aria-label="设置">⚙︎</button>
    </div>
  </header>
  <div class="demo-banner" id="demo-banner" hidden>
    <span>正在浏览<b>示例小院</b> · 改动不会保存</span>
    <button id="demo-exit">回到我的小院</button>
  </div>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="garden" data-icon="house" class="active"><img alt="">我的小院</button>
    <button data-tab="journal" data-icon="book"><img alt="">情绪手记</button>
    <button data-tab="care" data-icon="heart"><img alt="">关怀工具箱</button>
  </nav>
</div>

<div class="sheet-mask" id="record-mask"><div class="sheet" id="record-sheet"></div></div>
<div class="sheet-mask" id="quick-mask"><div class="sheet" id="quick"></div></div>
<div class="sheet-mask" id="detail-mask"><div class="sheet" id="detail"></div></div>
<div class="sheet-mask" id="player-mask"><div class="sheet player" id="player"></div></div>
<div class="sheet-mask" id="settings-mask"><div class="sheet" id="settings"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="sprites.js"></script>
<script src="app.js"></script>
</body>
</html>
